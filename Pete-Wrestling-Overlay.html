<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>Pete Wrestling Overlay</title>
<style>
:root{
  --panel:rgba(4,5,7,.96);
  --panel2:rgba(9,10,13,.98);
  --ink:rgba(245,242,231,.94);
  --muted:rgba(210,204,188,.64);
  --quiet:rgba(210,204,188,.34);
  --line:rgba(226,208,166,.2);
  --amber:#d4a853;
  --amber2:#ead18b;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:Georgia,'Times New Roman',serif;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--ink);font-family:var(--mono)}
.stack{
  position:fixed;
  right:14px;
  bottom:14px;
  width:329px;
  display:flex;
  flex-direction:column;
  gap:0;
  filter:drop-shadow(0 12px 26px rgba(0,0,0,.55));
}
.episode{
  order:1;
  background:var(--panel);
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:var(--r) var(--r) 0 0;
  padding:10px 11px 8px;
}
.kicker{display:flex;align-items:center;gap:7px;color:var(--amber);font:600 7px var(--mono);letter-spacing:.22em;text-transform:uppercase}
.kicker:before{content:'';width:11px;height:1px;background:var(--amber)}
.date{font:500 19px/.98 var(--serif);letter-spacing:.01em;text-transform:uppercase;margin:8px 0 3px;color:var(--ink)}
.title{font:700 8.5px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--amber2)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font:500 6.8px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.merch{
  order:2;
  background:var(--panel);
  border:1px solid var(--line);
  border-top:0;
  border-bottom:0;
  padding:8px 10px 8px;
}
.merch .kicker{margin-bottom:6px}
.merch-inner{
  display:flex;
  gap:8px;
  align-items:flex-start;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(226,208,166,.12);
  border-radius:5px;
  padding:6px;
  min-height:64px;
}
.merch-thumb{
  width:42px;
  height:52px;
  flex:none;
  border-radius:3px;
  object-fit:cover;
  background:#111;
  border:1px solid rgba(255,255,255,.08);
}
.merch-thumb.empty{background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px)}
.merch-meta{flex:1;min-width:0}
.merch-name{font:800 9px/1.1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.merch-coll{font:500 6.8px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.merch-price{font:700 8.5px/1 var(--mono);color:var(--amber2);margin-top:5px}
.ticker{
  order:3;
  display:flex;align-items:stretch;
  min-height:24px;
  border:1px solid var(--line);
  border-top:0;
  border-bottom:0;
  overflow:hidden;
  background:var(--panel2);
}
.ticker-tag{display:flex;align-items:center;padding:0 8px;flex:none;border-right:1px solid var(--line);color:var(--amber);font:700 6.5px var(--mono);letter-spacing:.18em;text-transform:uppercase}
.ticker-window{display:flex;align-items:center;min-width:0;overflow:hidden}
.ticker-track{white-space:nowrap;padding-left:10px;color:var(--ink);font:600 8px/1 var(--mono);letter-spacing:.035em;text-transform:uppercase;animation:scroll 34s linear infinite;will-change:transform}
.ticker.paused .ticker-track{animation-play-state:paused}
@keyframes scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-48%,0,0)}}
.webcam-wrap{
  order:4;
  position:relative;
  width:329px;
  height:278px;
  background:transparent;
  border:1px solid var(--line);
  border-top:0;
  border-radius:0 0 var(--r) var(--r);
  overflow:hidden;
  pointer-events:none;
}
.left-btn{
  position:fixed;
  left:0;top:50%;transform:translateY(-50%);
  z-index:21;
  writing-mode:vertical-rl;
  padding:10px 6px;
  border:1px solid #2a2a2a;
  border-left:0;
  border-radius:0 6px 6px 0;
  background:#141414;
  color:#aaa;
  font:600 10px/1 sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
}
.controls{
  position:fixed;
  left:12px;bottom:12px;
  z-index:20;
  width:320px;
  max-height:calc(100vh - 24px);
  overflow:auto;
  padding:0;
  border:1px solid #2a2a2a;
  border-radius:10px;
  background:#111;
  box-shadow:0 16px 40px rgba(0,0,0,.6);
  transform:translateX(calc(-100% - 24px));
  transition:transform .25s ease;
  font-family:system-ui,-apple-system,sans-serif;
}
.controls.open{transform:translateX(0)}
.controls-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 14px 12px;
  border-bottom:1px solid #222;
}
.controls-head h2{margin:0;font:600 13px/1 sans-serif;color:#fff}
.close{width:26px;height:26px;border:1px solid #2a2a2a;border-radius:6px;background:#1a1a1a;color:#666;font-size:14px;cursor:pointer}
.controls-body{padding:12px 14px 14px}
.group{margin-bottom:16px}
.label{font:600 10px/1 sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#777;margin:0 0 6px}
.input{width:100%;height:32px;padding:0 10px;border:1px solid #2a2a2a;border-radius:6px;background:#0a0a0a;color:#e5e5e5;font:400 13px/1 sans-serif}
.textarea{height:60px;padding:8px 10px;resize:vertical}
.row{display:flex;gap:6px}
.btn{height:32px;padding:0 12px;border:1px solid #2a2a2a;border-radius:6px;background:#1a1a1a;color:#aaa;font:500 12px sans-serif;cursor:pointer}
.btn:hover{background:#222;color:#fff}
.btn-primary{background:#e8e8e8;color:#111;border-color:#e8e8e8}
.check{display:flex;align-items:center;gap:8px;font:400 12px sans-serif;color:#999;margin-top:8px}
.range{width:100%}
.status{font:400 11px sans-serif;color:#666;word-break:break-all;margin-top:10px}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(8px);
  z-index:30;padding:8px 12px;border-radius:6px;
  background:#1e1e1e;color:#fff;font:500 12px sans-serif;
  opacity:0;transition:all .2s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
html[data-overlay="1"] .left-btn, html[data-overlay="1"] .controls{display:none !important}
</style>
</head>
<body>
<main class="stack" id="stack">
  <article class="episode">
    <div class="kicker">Episode date</div>
    <div class="date" id="dateOut">5TH APRIL 1986</div>
    <div class="title" id="titleOut">NWA WORLD WIDE WRESTLING</div>
    <div class="meta"><span id="promoOut">DATE WITH PETE</span></div>
  </article>
  <div class="merch" id="merchBox">
    <div class="kicker">Official Merch / Live</div>
    <div class="merch-inner">
      <img class="merch-thumb empty" id="merchImgOut" alt="">
      <div class="merch-meta">
        <div class="merch-name" id="merchNameOut">LOADING STORE...</div>
        <div class="merch-coll" id="merchCollOut">agoodpete-shop.fourthwall.com</div>
        <div class="merch-price" id="merchPriceOut"></div>
      </div>
    </div>
  </div>
  <div class="ticker" id="ticker">
    <span class="ticker-tag">Rules</span>
    <div class="ticker-window"><div class="ticker-track" id="rulesOut">GOOD VIBES ONLY · NO SPOILERS · PRESENT 1995 TERSE CHAT ·</div></div>
  </div>
  <div class="webcam-wrap" id="webcamWrap"></div>
</main>

<button class="left-btn" id="leftBtn">Controls</button>

<aside class="controls" id="controls">
  <div class="controls-head">
    <h2>Controls</h2>
    <button class="close" id="close">×</button>
  </div>
  <div class="controls-body">
    <div class="group">
      <div class="label">Episode</div>
      <input class="input" id="date" value="5TH APRIL 1986">
      <div style="height:6px"></div>
      <input class="input" id="title" value="NWA WORLD WIDE WRESTLING">
      <div style="height:6px"></div>
      <input class="input" id="promo" value="DATE WITH PETE">
    </div>
    <div class="group">
      <div class="label">Store - Live Fourthwall</div>
      <div class="row">
        <button class="btn" id="fetchMerch" style="flex:1">Refresh</button>
        <button class="btn" id="nextMerch" style="flex:1">Next</button>
      </div>
      <label class="check"><input id="autoRotate" type="checkbox" checked> Auto-rotate</label>
      <div class="status" id="status">Ready</div>
    </div>
    <div class="group">
      <div class="label">Ticker</div>
      <textarea class="input textarea" id="rules">Good vibes only · no spoilers · present 1995 terse chat</textarea>
      <div style="height:8px"></div>
      <input class="range" id="speed" type="range" min="20" max="90" value="34">
      <label class="check"><input id="pause" type="checkbox"> Pause ticker</label>
    </div>
    <div class="group">
      <div class="row">
        <button class="btn" id="copy" style="flex:1">Copy OBS URL</button>
        <button class="btn btn-primary" id="save" style="flex:1">Save</button>
      </div>
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORE_URL = "https://agoodpete-shop.fourthwall.com";

  const $=s=>document.querySelector(s);
  const params=new URLSearchParams(location.search);
  if(params.get('overlay')==='1') document.documentElement.setAttribute('data-overlay','1');

  const controls=$('#controls'), ticker=$('#ticker'), toast=$('#toast'), merchBox=$('#merchBox'), statusEl=$('#status');
  let products=[], currentIndex=0, rotateTimer=null;

  function close(){controls.classList.remove('open')}
  function open(){controls.classList.add('open')}
  function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>toast.classList.remove('show'),2000)}
  
  function renderStatic(){
    $('#dateOut').textContent=$('#date').value||'';
    $('#titleOut').textContent=$('#title').value||'';
    $('#promoOut').textContent=$('#promo').value||'';
    const r=$('#rules').value||''; $('#rulesOut').textContent=(r+' · '+r).toUpperCase();
    ticker.classList.toggle('paused',$('#pause').checked);
    $('.ticker-track').style.animationDuration=$('#speed').value+'s';
  }
  
  function showProduct(p){
    if(!p) return;
    $('#merchNameOut').textContent=(p.name||'').toUpperCase();
    $('#merchCollOut').textContent=p.collection||'';
    $('#merchPriceOut').textContent=p.price||'';
    const img=$('#merchImgOut');
    if(p.image){ 
      img.src=p.image; 
      img.classList.remove('empty');
      img.onerror=()=>{ img.classList.add('empty'); img.removeAttribute('src'); };
    } else { 
      img.removeAttribute('src'); 
      img.classList.add('empty'); 
    }
    merchBox.onclick=()=>{ if(p.url) window.open(p.url,'_blank'); };
    merchBox.style.cursor=p.url?'pointer':'default';
  }

  // Clean, fast proxy list specifically for scraping
  async function fetchTextWithProxy(url){
    const proxies = [
      u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
      u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
      u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
    ];
    for(let p of proxies){
      try{
        const res = await fetch(p(url));
        if(!res.ok) continue;
        return await res.text();
      }catch(e){ continue; }
    }
    return null;
  }

  // Primary Method: Fast DOM scrape
  async function tryScrapeMethod(){
    statusEl.textContent='Scraping store...';
    const pagesToTry = [
      `${STORE_URL}/en-gbp`,
      `${STORE_URL}/en-gbp/collections/all`,
      STORE_URL
    ];
    let allItems = [];
    let seenUrls = new Set();

    for(let pageUrl of pagesToTry){
      const html = await fetchTextWithProxy(pageUrl);
      if(!html) continue;
      try{
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const links = [...doc.querySelectorAll('a[href*="/products/"]')];
        
        links.forEach(a=>{
          let href = a.getAttribute('href');
          if(!href || href.includes('#') || (href.includes('?') && !href.includes('/products/'))) return;
          href = href.split('?')[0].split('#')[0];
          if(href.startsWith('/')) href = STORE_URL + href;
          if(seenUrls.has(href)) return;
          
          // Find the container holding the product info
          const card = a.closest('[class*="product"]') || a.closest('article') || a.parentElement;
          if(!card) return;
          
          let title = '';
          let price = '';
          let img = '';
          
          const titleEl = card.querySelector('h2,h3,[class*="title"],[class*="name"]') || a;
          if(titleEl) title = titleEl.textContent.trim().split('\n')[0].trim();
          if(!title || title.length < 3) title = href.split('/').pop().replace(/-/g,' ');
          
          // Improved Price Regex: catches £10, $10, £10.00, $10.50
          const priceMatch = (card.textContent || '').match(/(£|\$|EUR)\s*\d+([\.,]\d{2})?/);
          if(priceMatch) {
            price = priceMatch[0].replace('$','£').replace('EUR','£').replace('USD','').trim();
            if(!price.includes('£')) price='£'+price.replace(/[^\d.,]/g,'');
          }
          
          const imgEl = card.querySelector('img') || a.querySelector('img');
          if(imgEl){
            img = imgEl.getAttribute('src') || imgEl.getAttribute('data-src') || '';
            if(img.startsWith('/')) img = STORE_URL + img;
          }
          
          if(title && !title.toLowerCase().includes('view all') && title.length > 2){
            seenUrls.add(href);
            allItems.push({
              name: title.slice(0,60),
              collection: '',
              price: price,
              image: img,
              url: href,
              slug: href.split('/').pop()
            });
          }
        });
      }catch(e){ console.warn(e); }
      
      // If we successfully got products from this page, no need to try the next page
      if(allItems.length > 0) break; 
    }

    if(allItems.length){
      const unique = [];
      const seen = new Set();
      for(let it of allItems){
        const key = (it.slug || it.url).toLowerCase();
        if(!seen.has(key)){
          seen.add(key);
          unique.push(it);
        }
      }
      return unique;
    }
    return null;
  }

  // Fallback Method: Sitemap
  async function trySitemapMethod(){
    const sitemapUrls = [
      `${STORE_URL}/sitemap.xml`,
      `${STORE_URL}/sitemap_products.xml`,
      `${STORE_URL}/en-gbp/sitemap.xml`
    ];
    let allUrls = [];
    for(let sUrl of sitemapUrls){
      try{
        const xml = await fetchTextWithProxy(sUrl);
        if(!xml || !xml.includes('<url')) continue;
        const matches = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)];
        for(let mm of matches){
          const url = mm[1];
          if(url.includes('/products/') && !allUrls.includes(url)) allUrls.push(url);
        }
        if(allUrls.length) break;
      }catch(e){}
    }
    if(allUrls.length){
      return allUrls.map(url=>{
        const slug = url.split('/').pop().split('?')[0];
        return {name: slug.replace(/-/g,' '), collection:'', price:'', image:'', url: url, slug: slug};
      });
    }
    return null;
  }

  async function fetchFourthwallLive(){
    statusEl.textContent='Loading store...';
    
    // 1. Try Fast Scrape
    let result = await tryScrapeMethod();
    if(result && result.length){
      products = result;
      currentIndex = 0;
      showProduct(products[0]);
      statusEl.textContent=`${products.length} products (Live)`;
      say(`Loaded ${products.length} products`);
      startRotate();
      // Safely enrich any missing images in the background (max 5 to avoid lag)
      enrichMissingData();
      return;
    }

    // 2. Fallback to Sitemap if scrape fails
    statusEl.textContent='Scrape failed, trying sitemap...';
    result = await trySitemapMethod();
    if(result && result.length){
      products = result;
      currentIndex = 0;
      showProduct(products[0]);
      statusEl.textContent=`${products.length} products (Sitemap)`;
      say('Store via sitemap');
      startRotate();
      enrichMissingData();
      return;
    }

    // 3. Ultimate Fallback
    statusEl.textContent='Using cached data';
    products = [
      {name:"Strength Shirt", collection:"", price:"£25.54", image:"", url:"https://agoodpete-shop.fourthwall.com/en-gbp/products/strength-shirt", slug:"strength-shirt"},
      {name:"Tugsboat Shirt", collection:"", price:"£26.44", image:"", url:"https://agoodpete-shop.fourthwall.com/en-gbp/products/tugsboat-shirt", slug:"tugsboat-shirt"},
      {name:"Dr Harry Hardy's Bellend Workshop Shirt", collection:"", price:"£25.54", image:"", url:"https://agoodpete-shop.fourthwall.com/en-gbp/products/dr-harry-hardys-bellend-workshop-shirt", slug:"dr-harry-hardys-bellend-workshop-shirt"},
      {name:"Harry Hardy Bellend Party Mug", collection:"", price:"£10.21", image:"", url:"https://agoodpete-shop.fourthwall.com/en-gbp/products/harry-hardy-bellend-party-mug", slug:"harry-hardy-bellend-party-mug"}
    ];
    currentIndex=0;
    showProduct(products[0]);
    enrichMissingData();
    startRotate();
  }

  // Lightweight background fetcher for missing images ONLY
  async function enrichMissingData(){
    let enrichedCount = 0;
    for(let i=0; i<products.length; i++){
      if(enrichedCount >= 5) break; // Hard limit to prevent OBS lag
      if(products[i].image) continue; // Skip if we already have an image
      
      try{
        const html = await fetchTextWithProxy(products[i].url);
        if(!html) continue;
        const doc = new DOMParser().parseFromString(html, 'text/html');
        
        let updated = false;
        const ogImg = doc.querySelector('meta[property="og:image"]');
        if(ogImg){
          products[i].image = ogImg.getAttribute('content');
          updated = true;
        }
        
        if(!products[i].price){
          const priceMatch = doc.body.textContent.match(/(£|\$)\s*\d+([\.,]\d{2})?/);
          if(priceMatch){
            products[i].price = priceMatch[0].replace('$','£').replace('USD','').trim();
            if(!products[i].price.includes('£')) products[i].price = '£' + products[i].price.replace(/[^\d.,]/g,'');
            updated = true;
          }
        }
        
        if(updated){
          enrichedCount++;
          if(i === currentIndex) showProduct(products[i]);
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r, 400)); 
    }
  }

  function startRotate(){
    clearInterval(rotateTimer);
    if(!$('#autoRotate').checked || products.length<=1) return;
    rotateTimer=setInterval(()=>{
      currentIndex=(currentIndex+1)%products.length;
      showProduct(products[currentIndex]);
    },25000);
  }

  $('#leftBtn').onclick=()=>controls.classList.contains('open')?close():open();
  $('#close').onclick=close;
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape') close();
    if(e.key.toLowerCase()==='c' && !['INPUT','TEXTAREA'].includes(e.target.tagName)) controls.classList.contains('open')?close():open();
  });
  ['date','title','promo','rules'].forEach(id=>$('#'+id).addEventListener('input',renderStatic));
  $('#pause').onchange=renderStatic; 
  $('#speed').oninput=renderStatic;
  $('#autoRotate').onchange=startRotate;
  $('#fetchMerch').onclick=fetchFourthwallLive;
  $('#nextMerch').onclick=()=>{ if(products.length){ currentIndex=(currentIndex+1)%products.length; showProduct(products[currentIndex]); } };
  $('#copy').onclick=()=>{
    let u=location.href.split('?')[0]+'?overlay=1';
    navigator.clipboard?.writeText(u).then(()=>say('Copied')).catch(()=>prompt('Copy URL',u));
  };
  $('#save').onclick=()=>{
    localStorage.setItem('pete-final-working',JSON.stringify({
      date:$('#date').value,title:$('#title').value,promo:$('#promo').value,
      rules:$('#rules').value,speed:$('#speed').value
    })); say('Saved');
  };
  try{
    const s=JSON.parse(localStorage.getItem('pete-final-working')||'null');
    if(s){ Object.keys(s).forEach(k=>{ const el=$('#'+k); if(el) el.value=s[k]; }); }
  }catch{}
  renderStatic();
  setTimeout(fetchFourthwallLive,500);
})();
</script>
</body></html>
